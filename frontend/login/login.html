<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Fake - Login</title>
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>

<header>
    <h2>Spotify Fake</h2>
    <nav>
        <a href="login.html" class="ativo">Login</a>
        <a href="../cadastro/cadastro.html">Cadastro</a>
    </nav>
</header>

<main>
    <section class="container">
        <h1>LOGIN</h1>

        <img src="../../imagens/logo.png" alt="Logo Spotify Fake" class="logo-img">

        <input type="text" id="InputNome" placeholder="Nome de usuário ou e-mail" autocomplete="username">
        <div class="campo-senha">
            <input type="password" id="InputSenha" placeholder="Senha" autocomplete="current-password">
            <i class="bi bi-eye" id="BotaoVizualizar" onclick="MostrarSenha()"></i>
        </div>

        <button onclick="funclogar()">Entrar</button>

        <p>Ainda não possui uma conta? <a href="../cadastro/cadastro.html">Cadastre-se</a></p>

        <div id="saida"></div>
    </section>
</main>

<!-- Aparece só para o admin: escolher como quer entrar -->
<aside id="modalModo" class="modal-fundo" hidden>
    <div class="modal">
        <h2>Como você quer entrar?</h2>
        <p id="modalOla"></p>
        <button onclick="escolherModo('usuario')">🎧 Entrar como usuário</button>
        <button class="secundario" onclick="escolherModo('admin')">🛠️ Entrar como admin</button>
    </div>
</aside>

<footer>
    <p><strong>SpotifyFake</strong> &mdash; Projeto de DW1 &mdash; 4º Bimestre 2026</p>
    <p>Matheus Dziubate &mdash; Turma: M32 &mdash; 2026</p>
</footer>

<script src="login.js"></script>
</body>
</html>
