<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Fake - Cadastro</title>
    <link rel="stylesheet" href="../login/login.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>

<header>
    <h2>Spotify Fake</h2>
    <nav>
        <a href="../login/login.html">Login</a>
        <a href="cadastro.html" class="ativo">Cadastro</a>
    </nav>
</header>

<main>
    <section class="container">
        <h1>CADASTRO</h1>

        <img src="../../imagens/logo.png" alt="Logo Spotify Fake" class="logo-img">

        <input type="text" id="InputNome" placeholder="Nome de usuário" autocomplete="username">
        <input type="email" id="InputEmail" placeholder="E-mail" autocomplete="email">
        <div class="campo-senha">
            <input type="password" id="InputSenha" placeholder="Senha (mínimo 6 caracteres)" autocomplete="new-password">
            <i class="bi bi-eye" id="BotaoVizualizar" onclick="MostrarSenha()"></i>
        </div>
        <input type="password" id="InputConfirmarSenha" placeholder="Confirmar senha" autocomplete="new-password">

        <button onclick="funccadastro()">Cadastrar</button>

        <p>Já tem uma conta? <a href="../login/login.html">Logar</a></p>

        <div id="saida"></div>
    </section>
</main>

<footer>
    <p><strong>SpotifyFake</strong> &mdash; Projeto de DW1 &mdash; 4º Bimestre 2026</p>
    <p>Matheus Dziubate &mdash; Turma: M32 &mdash; 2026</p>
</footer>

<script src="cadastro.js"></script>
</body>
</html>
